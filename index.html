<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stdent CRUD</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container-fluid">

        <div class="row">
            <div class="col-md-6 mt-4 mb-4 offset-md-3">
                <form id="form" class="studentForm">
                    <div class="card formCard">
                        <div class="card-header formCardHeader">
                            <h4 class="m-0">Add Student</h4>
                        </div>
                        <div class="card-body formCardBody">
                            <div class="mb-3">
                                <label for="first_name">First Name</label>
                                <input id="first_name" type="text" class="form-control formCardControl">
                            </div>
                            <div class="mb-3">
                                <label for="last_name">Last Name</label>
                                <input id="last_name" type="text" class="form-control formCardControl">
                            </div>
                            <div class="mb-3">
                                <label for="email">Email</label>
                                <input id="email" type="email" class="form-control formCardControl">
                            </div>
                            <div class="mb-3">
                                <label for="contact">Contact</label>
                                <input id="contact" type="number" class="form-control formCardControl">
                            </div>
                        </div>
                        <div class="card-footer formCardFooter">
                            <button type="submit" id="addStudentBtn" class="btn btn-sm w-100 btn-primary">Add
                                Student</button>
                            <button type="button" id="updateStudentBtn"
                                class="btn btn-sm w-100 btn-primary d-none">Update
                                Student</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="row studentContainer">
            <div class="col-md-10 offset-md-1">
                <div class="card stdCard">
                    <div class="card-body stdCardBody">
                        <div class="table-responsive">
                            <table class="table table-bordered w-100">
                                <thead>
                                    <tr>
                                        <th>Sr.No.</th>
                                        <th>First Name</th>
                                        <th>Last Name</th>
                                        <th>Email</th>
                                        <th>Contact</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="studentsContainer">
                                    <!-- <tr>
                                    <td>1</td>
                                    <td>Atul</td>
                                    <td>Patil</td>
                                    <td>atul.gmail.com</td>
                                    <td>8998899899</td>
                                    <td class="d-flex justify-content-between">
                                        <button class="btn btn-sm btn-primary">Edit</button>
                                        <button class="btn btn-sm btn-danger">Delete</button>
                                    </td>
                                </tr> -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="spinnerOverlay d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden"></span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
